name: Newman Integration Tests

on:
  push:
    branches: [dev, main]
    paths:
      - "src/**"
  pull_request:
    branches: [dev, main]
    paths:
      - "src/**"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Cache Maven Dependencies
        uses: actions/cache@v3
        with:
          path: ~/.m2
          key: maven-${{ runner.os }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            maven-${{ runner.os }}-

      - name: Build & Run Tests with Maven
        run: mvn clean package -DskipTests

      - name: Ensure JAR file exists
        run: |
          if [ -z "$(ls -A target/*.jar 2>/dev/null)" ]; then
            echo "ERROR: No JAR file found!"
            exit 1
          fi

      - name: Start Spring Boot Application
        run: nohup java -jar target/*.jar > app.log 2>&1 &

      - name: Wait for API to Start
        run: |
          for i in {1..30}; do
            if curl --silent --fail http://localhost:8080/actuator/health; then
              echo "API is up!"
              exit 0
            fi
            echo "Waiting for API..."
            sleep 5
          done
          echo "ERROR: API failed to start."
          exit 1

      - name: Ensure Postman Collection Exists
        run: |
          if [ ! -f postman/sales-agent.postman_collection.json ]; then
            echo "ERROR: Postman collection file not found!"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Newman and Reporters
        run: npm install -g newman newman-reporter-html newman-reporter-json

      - name: Run Newman Tests and Generate Report
        run: |
          TIMESTAMP=$(date +"%Y-%m-%d")
          mkdir -p test-reports
          newman run postman/sales-agent.postman_collection.json \
          --reporters cli,json,html \
          --reporter-json-export test-reports/newman-report-$TIMESTAMP.json \
          --reporter-html-export test-reports/newman-report-$TIMESTAMP.html

      - name: Upload Test Reports
        uses: actions/upload-artifact@v4
        with:
          name: newman-test-reports
          path: test-reports/
          retention-days: 7